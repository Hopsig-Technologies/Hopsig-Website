name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - name: Content gate (every reference string and link is in web/content or the Sanity seed)
        run: pnpm check:content
      - name: Generated Sanity types are current
        run: pnpm --filter studio typegen && git diff --exit-code web/sanity/types.ts
      - name: Chromium for the animation checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Animations (loop seams, no errors)
        run: pnpm anim:test
      - name: Static animation frames are current
        # The SVGs are computed geometry and must match; the IoT canvas PNG is a raster and may differ by platform.
        run: pnpm anim:static && git diff --exit-code -- 'web/public/anim/*.svg'
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Build web
        run: pnpm --filter web build
      - name: Phones (every route at 360 and 390 wide; no sideways scroll, gutter, 44px targets, 16px fields)
        run: |
          (cd web && pnpm exec next start -p 3100 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/ && break; sleep 1; done
          pnpm check:mobile
      - name: Build studio
        run: pnpm --filter studio build
