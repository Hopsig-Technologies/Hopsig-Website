name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - name: Content gate (Phase 0)
        run: python scripts/check_bundle.py
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Build web
        run: pnpm --filter web build
      - name: Build studio
        run: pnpm --filter studio build
